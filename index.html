<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Артисты</title>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>

<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b0f;color:#fff;font-family:Arial,sans-serif}
.app{padding:14px}
.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
h1{font-size:22px;margin:0}
button{border:0;border-radius:12px;padding:11px 14px;font-weight:800;cursor:pointer}
.add{background:#2d81ff;color:white}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:14px}
.card{display:block;text-decoration:none;color:white}
.cover{width:100%;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#191922;border:1px solid #333}
.cover img{width:100%;height:100%;object-fit:cover}
.name{text-align:center;font-weight:800;margin-top:7px;font-size:14px}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);padding:16px;z-index:10}
.box{max-width:430px;margin:auto;background:#17171d;border:1px solid #333;border-radius:18px;padding:16px}
input{width:100%;padding:12px;margin:8px 0;background:#0d0d12;color:white;border:1px solid #444;border-radius:12px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.gray{background:#333;color:white}
.red{background:#ff3b3b;color:white;margin-top:8px}
.empty{color:#aaa;text-align:center;margin-top:50px}
</style>
</head>

<body>
<div class="app">
  <div class="head">
    <h1>Артисты</h1>
    <button id="addBtn" class="add" style="display:none" onclick="openModal()">+ Добавить артиста</button>
  </div>

  <div id="grid" class="grid"></div>
  <div id="empty" class="empty" style="display:none">Пока нет артистов</div>
</div>

<div id="modal" class="modal">
  <div class="box">
    <h2>Добавить артиста</h2>

    <input id="name" placeholder="Название артиста">
    <input id="link" placeholder="Ссылка на VK карточку артиста">
    <input id="file" type="file" accept="image/*">

    <div class="row">
      <button class="add" onclick="saveArtist()">Сохранить</button>
      <button class="gray" onclick="closeModal()">Закрыть</button>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://uxrboufroykwbqnfjwrp.supabase.co";
const SUPABASE_KEY = "sb_publishable_-b6fXb3tT06il0QlinGaXA_ZfoBgJQl";

const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const admins = ["78154953","152137568"];
let isAdmin = false;

async function initVK(){
  try{
    await vkBridge.send("VKWebAppInit");
    const user = await vkBridge.send("VKWebAppGetUserInfo");
    isAdmin = admins.includes(String(user.id));
    if(isAdmin) document.getElementById("addBtn").style.display = "block";
  }catch(e){
    console.log("VK Bridge недоступен", e);
  }
}

async function loadArtists(){
  const {data,error} = await client
    .from("artists")
    .select("*")
    .order("sort_order",{ascending:true})
    .order("id",{ascending:true});

  const grid = document.getElementById("grid");
  const empty = document.getElementById("empty");
  grid.innerHTML = "";

  if(error){
    empty.style.display = "block";
    empty.innerText = "Ошибка загрузки артистов";
    console.log(error);
    return;
  }

  if(!data || data.length === 0){
    empty.style.display = "block";
    return;
  }

  empty.style.display = "none";

  data.forEach(a=>{
    grid.innerHTML += `
      <div>
        <a class="card" href="${a.vk_url || '#'}" target="_blank">
          <div class="cover">
            <img src="${a.image_url || ''}" onerror="this.style.display='none'">
          </div>
          <div class="name">${a.name}</div>
        </a>
        ${isAdmin ? `<button class="red" onclick="deleteArtist(${a.id})">Удалить</button>` : ""}
      </div>
    `;
  });
}

function openModal(){
  document.getElementById("modal").style.display = "block";
}

function closeModal(){
  document.getElementById("modal").style.display = "none";
}

function safeFileName(file){
  const ext = file.name.split(".").pop().toLowerCase();
  const allowed = ["jpg","jpeg","png","webp","gif"];

  if(!allowed.includes(ext)){
    return null;
  }

  return "artist-" + Date.now() + "-" + Math.random().toString(36).slice(2) + "." + ext;
}

async function saveArtist(){
  if(!isAdmin){
    alert("Нет доступа");
    return;
  }

  const name = document.getElementById("name").value.trim();
  const link = document.getElementById("link").value.trim();
  const file = document.getElementById("file").files[0];

  if(!name || !link || !file){
    alert("Заполни название, ссылку и выбери картинку");
    return;
  }

  const fileName = safeFileName(file);

  if(!fileName){
    alert("Поддерживаются только JPG, PNG, WEBP или GIF");
    return;
  }

  const upload = await client.storage
    .from("artists")
    .upload(fileName, file, {
      cacheControl: "3600",
      upsert: false
    });

  if(upload.error){
    alert("Ошибка загрузки фото: " + upload.error.message);
    console.log(upload.error);
    return;
  }

  const publicUrl = client.storage
    .from("artists")
    .getPublicUrl(fileName)
    .data.publicUrl;

  const insert = await client.from("artists").insert({
    name: name,
    vk_url: link,
    image_url: publicUrl,
    sort_order: 999
  });

  if(insert.error){
    alert("Ошибка сохранения артиста: " + insert.error.message);
    console.log(insert.error);
    return;
  }

  document.getElementById("name").value = "";
  document.getElementById("link").value = "";
  document.getElementById("file").value = "";

  closeModal();
  loadArtists();
}

async function deleteArtist(id){
  if(!isAdmin) return;
  if(!confirm("Удалить артиста?")) return;

  const {error} = await client.from("artists").delete().eq("id",id);

  if(error){
    alert("Ошибка удаления: " + error.message);
    console.log(error);
    return;
  }

  loadArtists();
}

initVK().then(loadArtists);
</script>
</body>
</html>
